version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: gpyeong-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: gpyeong
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:latest
    container_name: gpyeong-redis
    ports:
      - "6379:6379"

volumes:
  mongo-data:
