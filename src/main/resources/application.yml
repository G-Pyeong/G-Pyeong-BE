app:
  auth:
    school-name: 가천대학교
    allowed-email-domain: gachon.ac.kr

spring:
  config:
    import: optional:classpath:application-secret.yml

exclude-auth-path-patterns:
  paths:
    - path-pattern: /swagger-ui.html
      method: GET
    - path-pattern: /swagger-ui/index.html
      method: GET
    - path-pattern: /swagger-ui/**
      method: GET
    - path-pattern: /v3/api-docs
      method: GET
    - path-pattern: /v3/api-docs/swagger-config
      method: GET
    - path-pattern: /actuator/**
      method: GET
    - path-pattern: /api/users/signup
      method: POST
    - path-pattern: /api/users/login
      method: POST
    - path-pattern: /api/users/reissue
      method: POST
    - path-pattern: /api/auth/email/**
      method: POST
    - path-pattern: /**
      method: OPTIONS

exclude-blacklist-path-patterns:
  paths:
    - path-pattern: /swagger-ui.html
      method: GET
    - path-pattern: /swagger-ui/index.html
      method: GET
    - path-pattern: /swagger-ui/**
      method: GET
    - path-pattern: /v3/api-docs
      method: GET
    - path-pattern: /v3/api-docs/swagger-config
      method: GET
    - path-pattern: /actuator/**
      method: GET
    - path-pattern: /api/users/signup
      method: POST
    - path-pattern: /api/users/login
      method: POST
    - path-pattern: /api/users/reissue
      method: POST
    - path-pattern: /api/auth/email/**
      method: POST
    - path-pattern: /**
      method: OPTIONS

cors:
  allowed-origins: "http://localhost:5173,http://localhost:3000,http://localhost:8080"
  allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  allowed-headers: "Authorization,Content-Type,Accept"
  max-age: 3600

# Swagger
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    groups-order: DESC
    tags-sorter: alpha
    operations-sorter: method
    enabled: true
  paths-to-match:
    - /api/**